# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  merge_group:
  push:
    branches: [ develop ]

  pull_request:
    branches: [ develop ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

#cancel a running workflow if something new is pushed for the branch (to save calculation time budget)
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code coverage (i.e. jacoco) needs the same classes for its test otherwise its classids can possibly not match
  Compilation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: cache maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache compilation
        id: cache-compilation
        uses: actions/cache@v4
        with:
          path: | 
                **/target/
          key: cache-compilation-${{ github.sha }}

      - name: Build
        run: mvn -B compile -Dfmt.skip -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

  Tests:
    needs: Compilation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [17]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: 'zulu'
      - name: get cached compilation
        id: cache-compilation
        uses: actions/cache@v4
        with:
          path: | 
                **/target/
          key: cache-compilation-${{ github.sha }}

      - name: cache maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Test (JDK${{ matrix.version }})
        run: mvn -B -am verify -Dfmt.skip -Dmaven.main.skip=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: rename unit test reports according to the current matrix version
        run: mv **/target/coverage-reports/jacoco-ut.exec  **/target/coverage-reports/jacoco-ut-jdk${{ matrix.version }}.exec

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: coverage-exec-jdk${{ matrix.version }}
          path: |
            **/target/coverage-reports/jacoco-ut.exec

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-reports-jdk${{ matrix.version }}
          path: |
            **/target/surefire-reports

    # takes a long time to run - so just run them when PR is not draft anymore
  CoverageReport:
    runs-on: ubuntu-latest
    needs: [ Tests ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: cache maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: get cached compilation
        id: cache-compilation
        uses: actions/cache@v4
        with:
          path: |
            **/target/
          key: cache-compilation-${{ github.sha }}

      - name: Download uploaded exec artifacts for JDK17
        uses: actions/download-artifact@v4

      - name: merge coverage reports
        run:  mvn -ntp jacoco:merge@merge-results  -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: aggregate coverage reports across java versions
        run: mvn -ntp jacoco:report-aggregate@generate-coverage-report  -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: upload aggregated coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-coverage-report
          path: sootup.report/target/jacoco-aggregate/

      - name: jacoco-badge-generator
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.8.1
        with:
          jacoco-csv-file: sootup.report/target/jacoco-aggregate/jacoco.csv

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: sootup.report/target/jacoco-aggregate/jacoco.xml



  publish-javadoc:
    needs: Compilation
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy JavaDoc 🚀
        uses: MathieuSoysal/Javadoc-publisher.yml@v2.0.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          javadoc-branch: gh-pages
          java-version: 17
          target-folder: apidocs
