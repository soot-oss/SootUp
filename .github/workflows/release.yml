name: Prepare Release
run-name: Release ${{ inputs.release_type }} triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  prepare-release:
    name: Open release PR against develop
    # Reusable workflow: secure-software-engineering/actions/release/README.md
    uses: secure-software-engineering/actions/.github/workflows/maven-release-prepare.yml@5df8d9ec2f3351fbb13f2a7782dcdc4502e1a4dc # develop
    with:
      release_type: ${{ inputs.release_type }}
      head_branch: develop
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }} # default GITHUB_TOKEN is blocked by branch protection / can't trigger downstream workflows
