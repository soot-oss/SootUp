name: Release Schedule

on:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  schedule:
    permissions:
      contents: read
      pull-requests: read
    uses: secure-software-engineering/actions/.github/workflows/maven-release-schedule.yml@c98577761faae44108ba0ec2de7ebd67ddd4b40b # develop
    with:
      head_branch: develop
      java_version: '17'
      release_ready_age_days: '28'
      stale_pr_age_days: '7'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
