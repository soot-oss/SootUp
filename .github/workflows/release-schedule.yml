name: Release Schedule

on:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  schedule:
    uses: secure-software-engineering/actions/.github/workflows/maven-release-schedule.yml@5df8d9ec2f3351fbb13f2a7782dcdc4502e1a4dc
    with:
      head_branch: develop
      java_version: '17'
      release_ready_age_days: '28'
      stale_pr_age_days: '7'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
