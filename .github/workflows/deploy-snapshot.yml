name: Deploy SNAPSHOT versions

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy-snapshot:
    runs-on: ubuntu-latest
    name: Deploy SNAPSHOT version
    environment: deployment
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: adopt
          java-package: jdk
          java-version: 17

      - name: Get project version
        run: |
          echo "PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | grep -v '^\[' | tail -1)" >> $GITHUB_ENV

      - name: Deploy SNAPSHOT version
        if: endsWith(env.PROJECT_VERSION, '-SNAPSHOT')
        uses: secure-software-engineering/actions/deployment/maven-deployment@5df8d9ec2f3351fbb13f2a7782dcdc4502e1a4dc # develop
        with:
          java-distribution: adopt
          java-version: 17
          server-id: central
          server-username: ${{ secrets.MAVEN_USERNAME }}
          server-password: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
          mvn-cli-args: '-DskipTests -Drelease'
          deploy-mode: snapshot
