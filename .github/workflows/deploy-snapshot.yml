name: Deploy SNAPSHOT versions

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy-snapshot:
    runs-on: ubuntu-latest
    name: Deploy SNAPSHOT version
    environment: deployment
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy SNAPSHOT version
        uses: secure-software-engineering/actions/deployment/maven-deployment@0caaeef2e50a42448e00423a073c676aebead49f # develop
        with:
          java-distribution: adopt
          java-version: 17
          server-id: central
          server-username: ${{ secrets.MAVEN_USERNAME }}
          server-password: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
          mvn-cli-args: '-DskipTests -Drelease'
          deploy-mode: snapshot
